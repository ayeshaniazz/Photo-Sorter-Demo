<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3d2f4f;
    --ink-2: #5d4c70;
    --muted: #9d8fb0;
    --faint: #cbbfdb;
    --line: #efe6f8;
    --lilac: #b79cf0;
    --lilac-deep: #8e6fd8;
    --lilac-soft: #f1eafd;
    --pink: #f4a3c8;
    --pink-deep: #e2679f;
    --pink-soft: #fdeaf3;
    --accent: #8e6fd8;
    --grad: linear-gradient(135deg, #b79cf0 0%, #d7a3e6 50%, #f4a3c8 100%);
    --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
    --hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
    --sans: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; background: #f7f2fc; display: grid; place-items: center; padding: 20px; overflow: hidden; }
  .blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blobs i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; }
  .blobs i:nth-child(1) { width: 520px; height: 520px; left: -120px; top: -140px; background: #e4d6ff; }
  .blobs i:nth-child(2) { width: 480px; height: 480px; right: -100px; bottom: -160px; background: #ffd6e8; }
  .blobs i:nth-child(3) { width: 360px; height: 360px; right: 22%; top: -180px; background: #fbe3f4; }

  .window {
    position: relative; z-index: 1; width: min(1360px, 100%); height: min(900px, calc(100vh - 40px)); min-height: 600px;
    background: rgba(255,255,255,.78); backdrop-filter: blur(18px); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 0 0 1px rgba(183,156,240,.18), 0 40px 90px -40px rgba(142,111,216,.45), 0 10px 30px -20px rgba(226,103,159,.3);
  }

  /* ---------- header ---------- */
  header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 28px 16px; flex-wrap: wrap; }
  .me { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .dp { position: relative; width: 66px; height: 66px; flex: none; border-radius: 50%; padding: 3px; border: 0; cursor: pointer; background: var(--grad); box-shadow: 0 8px 22px -8px rgba(226,103,159,.55); }
  .dp .ring { width: 100%; height: 100%; border-radius: 50%; padding: 3px; background: #fff; }
  .dp img, .dp .ph { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .dp .ph { display: grid; place-items: center; background: linear-gradient(160deg, var(--lilac-soft), var(--pink-soft)); color: var(--lilac-deep); }
  .dp [hidden] { display: none; }
  .dp .edit { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--pink-deep); box-shadow: 0 2px 8px rgba(142,111,216,.35); transition: transform .15s; }
  .dp:hover .edit { transform: scale(1.1); }
  .modal a.primary { display: inline-flex; align-items: center; text-decoration: none; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--grad); color: #fff; padding: 9px 18px; box-shadow: 0 6px 16px -6px rgba(226,103,159,.7); }
  .kicker { font-family: var(--hand); font-size: 23px; line-height: 1; color: var(--pink-deep); }
  h1 { margin: 4px 0 0; font-weight: 500; font-size: 30px; letter-spacing: -0.025em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.22em; letter-spacing: -0.01em; padding: 0 .08em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { min-width: 112px; padding: 10px 16px 11px; border-radius: 18px; background: var(--lilac-soft); }
  .stat:nth-child(2) { background: var(--pink-soft); }
  .stat:nth-child(3) { background: #f3ecfb; }
  .stat:nth-child(4) { background: #fde9ee; }
  .stat .v { display: block; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .l { font-size: 11.5px; color: var(--muted); }

  /* ---------- album cards (left, 3 columns) ---------- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(560px, 44%) minmax(0, 1fr); gap: 20px; padding: 0 28px; }
  .col { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: repeat(7, minmax(0, 1fr)); gap: 7px; min-height: 0; padding: 2px 2px 16px; }
  .cat {
    position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 8px 10px; border-radius: 16px;
    background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 14px -10px rgba(142,111,216,.35); transform-origin: 50% 50%; transition: border-color .4s, box-shadow .4s;
  }
  .cat[hidden] { display: none; }
  .cat.hit { border-color: #c8a7ee; box-shadow: 0 0 0 3px rgba(190,150,230,.2), 0 6px 18px -10px rgba(142,111,216,.6); transition: none; }
  .cat .top { display: flex; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; }
  .cat .fold { width: 14px; height: 14px; flex: none; color: var(--lilac); }
  .cat .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat .sub { display: none; }
  .cat .count { min-width: 26px; height: 20px; padding: 0 7px; border-radius: 10px; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--lilac-soft); color: var(--lilac-deep); }
  .cat .count.zero { background: #f7f4fa; color: var(--faint); }
  .row2 { margin-top: 6px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .strip { flex: 1; min-width: 0; height: 28px; display: flex; gap: 4px; align-items: center; padding: 0 3px; border-radius: 9px; background: #faf6fd; overflow: hidden; }
  .mini { width: 22px; height: 22px; flex: none; border-radius: 6px; border: 1.5px solid #fff; overflow: hidden; background: #f1eaf6; box-shadow: 0 1px 3px rgba(110,80,160,.3); }
  .mini img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* ---------- stage ---------- */
  .stage {
    position: relative; border-radius: 26px; overflow: hidden; margin-bottom: 16px; min-height: 380px;
    background:
      radial-gradient(ellipse 55% 45% at 50% 46%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%),
      radial-gradient(circle at 15% 15%, #efe4ff 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, #ffe0ee 0%, transparent 45%),
      linear-gradient(160deg, #f7f1ff, #fff3f8);
    box-shadow: 0 0 0 1px rgba(183,156,240,.2) inset;
  }
  .stage::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(183,156,240,.25) 1px, transparent 1.2px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(ellipse at center, transparent 30%, #000 85%); mask-image: radial-gradient(ellipse at center, transparent 30%, #000 85%); }
  .stage .core { position: absolute; left: 50%; top: calc(50% - 46px); width: 70%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
                 background: radial-gradient(closest-side, rgba(244,163,200,.32), rgba(183,156,240,.14) 50%, transparent 75%); }
  .stage .hint { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font-size: 12.5px; color: var(--muted); transition: opacity .3s; }
  .stage .hint b { font-weight: 600; color: var(--pink-deep); }
  .stage .caption { position: absolute; left: 0; right: 0; bottom: 80px; text-align: center; font-family: var(--serif); font-style: italic; font-size: 20px; color: #b48ad0; transition: opacity .5s; }
  .stage .progress { position: absolute; inset: 0 0 80px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 13px; }
  .stage .progress.on { display: flex; }
  .bar { width: 240px; height: 6px; border-radius: 6px; background: #efe6f8; overflow: hidden; }
  .bar > div { height: 100%; width: 100%; background: var(--grad); border-radius: 6px; transform-origin: 0 50%; transform: scaleX(0); }
  .progress .file { font-size: 11.5px; color: var(--faint); max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage .empty, .stage .finale { position: absolute; inset: 0 0 80px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; pointer-events: none; opacity: 0; transition: opacity .6s, transform .8s cubic-bezier(.2,.8,.2,1.2); }
  .stage .empty.on { opacity: 1; }
  .stage .empty em { font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--ink); }
  .finale { transform: scale(.92); }
  .finale.on { opacity: 1; transform: scale(1); }
  .finale .big { font-family: var(--serif); font-style: italic; font-size: 60px; line-height: 1.05; letter-spacing: -0.01em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .12em; }
  .finale .small { margin-top: 10px; font-size: 13.5px; }

  /* ---------- toolbar ---------- */
  .dock {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2;
    display: flex; gap: 4px; padding: 6px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(183,156,240,.22), 0 12px 30px -12px rgba(142,111,216,.5);
  }
  button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: transparent; border: 0;
    padding: 9px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background .15s, opacity .15s, box-shadow .2s;
  }
  button:hover { background: var(--lilac-soft); }
  button:disabled { opacity: .38; cursor: default; background: transparent; }
  button.primary { background: var(--grad); color: #fff; padding: 9px 18px; box-shadow: 0 6px 16px -6px rgba(226,103,159,.7); }
  button.primary:hover { box-shadow: 0 8px 20px -6px rgba(226,103,159,.85); }
  button.primary:disabled { background: var(--grad); }
  button.ghost { border: 1px solid var(--line); background: #fff; }
  button.ghost:hover { background: var(--lilac-soft); }
  kbd { font-family: var(--sans); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; line-height: 16px; background: #fff; }
  button.primary kbd { color: #fff; background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.45); }
  .dock .sep { width: 1px; background: var(--line); margin: 6px 2px; }

  footer { flex: none; padding: 0 28px 14px; font-size: 11.5px; color: var(--muted); display: flex; gap: 8px 18px; flex-wrap: wrap; }
  footer span::before { content: "♡"; margin-right: 6px; color: var(--pink); }

  /* ---------- flying layer ---------- */
  #layer { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .pc { position: absolute; left: 0; top: 0; width: 64px; padding: 2px; background: #fff; border-radius: 10px;
        box-shadow: 0 0 0 .5px rgba(120,80,170,.08), 0 2px 4px rgba(120,80,170,.14), 0 10px 18px -8px rgba(120,80,170,.38); will-change: transform; transition: opacity .5s; }
  .pc img { display: block; width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #f3eefa; }
  .glint { position: absolute; left: 0; top: 0; width: 50px; height: 50px; border-radius: 50%; opacity: 0; z-index: 5000;
           background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(244,163,200,.55) 35%, rgba(183,156,240,0) 70%); will-change: transform, opacity; }

  /* ---------- modal & toast ---------- */
  .modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(70,50,100,.22); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-back.on { display: flex; }
  .modal { width: min(470px, 100%); background: #fff; border-radius: 24px; padding: 24px 24px 20px; box-shadow: 0 40px 80px -24px rgba(110,70,170,.5), 0 0 0 1px rgba(183,156,240,.2); }
  .modal h2 { margin: 0 0 6px; font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
  .modal h2 em { font-family: var(--serif); font-weight: 400; font-size: 1.15em; color: var(--pink-deep); }
  .modal p { margin: 6px 0; font-size: 13px; line-height: 1.55; color: #67597b; }
  .modal .list { margin: 12px 0; border-radius: 14px; background: #faf7fd; border: 1px solid var(--line); max-height: 240px; overflow: auto; }
  .modal .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12.5px; border-top: 1px solid var(--line); }
  .modal .row:first-child { border-top: 0; }
  .modal .row span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .modal .fine { font-size: 11.5px; color: var(--muted); }
  .modal .bar { width: 100%; margin: 16px 0 6px; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 20px); z-index: 120; background: var(--ink); color: #fff; font-size: 13px; padding: 11px 18px; border-radius: 16px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: min(560px, calc(100vw - 32px)); text-align: center; line-height: 1.45; box-shadow: 0 16px 40px -14px rgba(61,47,79,.6); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- smaller screens ---------- */
  @media (max-width: 1100px) {
    body { overflow: auto; place-items: start center; padding: 12px; }
    .window { height: auto; min-height: 0; }
    main { grid-template-columns: 1fr; }
    .stage { order: -1; height: 540px; }
    .col { grid-template-rows: none; grid-auto-rows: 66px; }
  }
  @media (max-width: 680px) {
    main { padding: 0 16px; }
    header, footer { padding-left: 16px; padding-right: 16px; }
    .col { grid-template-columns: 1fr 1fr; }
    h1 { font-size: 24px; white-space: normal; }
    .stat { min-width: 0; flex: 1 1 40%; }
    .dock { width: calc(100% - 20px); bottom: 10px; flex-wrap: wrap; justify-content: center; border-radius: 22px; white-space: normal; }
    .dock .sep, .dock kbd { display: none; }
    .dock button { padding: 8px 11px; }
  }
  /* ---------- album viewer ---------- */
  .col.open .cat:not([hidden]) { cursor: pointer; }
  .col.open .cat:not([hidden]):hover { border-color: #d9c4f3; box-shadow: 0 0 0 3px rgba(190,150,230,.14), 0 8px 20px -12px rgba(142,111,216,.6); }
  .col.open .cat:focus-visible { outline: 2px solid var(--lilac-deep); outline-offset: 2px; }
  .gal-back { position: fixed; inset: 0; z-index: 90; background: rgba(70,50,100,.22); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 24px; }
  .gal-back.on { display: flex; }
  .gal { width: min(1080px, 100%); height: min(760px, 100%); background: #fff; border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 40px 80px -24px rgba(110,70,170,.5), 0 0 0 1px rgba(183,156,240,.2); }
  .gal-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px 24px; border-bottom: 1px solid var(--line); }
  .gal-head .t { flex: 1; min-width: 0; }
  .gal-head h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gal-head h2 em { font-family: var(--serif); font-weight: 400; font-size: 1.12em; color: var(--pink-deep); }
  .gal-head .s { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xbtn { flex: none; width: 36px; height: 36px; padding: 0; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: #fff; color: var(--ink-2); }
  .xbtn:hover { background: var(--lilac-soft); }
  .gal-grid { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; align-content: start; grid-auto-rows: max-content; }
  .gal-sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin: 10px 2px 0; font-size: 13px; font-weight: 600; color: var(--ink); }
  .gal-sec:first-child { margin-top: 0; }
  .gal-sec i { width: 9px; height: 9px; border-radius: 3px; }
  .gal-sec span { font-weight: 500; font-size: 11.5px; color: var(--muted); background: #f7f3fb; border-radius: 9px; padding: 1px 8px; }
  .tile { position: relative; display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: #f6f1fb; cursor: pointer; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .tile:hover img { transform: scale(1.05); }
  .tile:focus-visible { outline: 2px solid var(--lilac-deep); outline-offset: 2px; }
  .tile .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 7px 5px; font-size: 10.5px; color: #fff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(transparent, rgba(40,25,60,.6)); opacity: 0; transition: opacity .2s; }
  .tile:hover .nm, .tile:focus-visible .nm { opacity: 1; }
  .view { position: fixed; inset: 0; z-index: 95; background: rgba(28,18,40,.88); display: none; flex-direction: column; }
  .view.on { display: flex; }
  .view-top { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: #fff; }
  .view-top .t { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .view-top .t span { color: rgba(255,255,255,.6); margin-left: 8px; }
  .view .xbtn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); color: #fff; }
  .view .xbtn:hover { background: rgba(255,255,255,.22); }
  .view-body { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 72px 24px; }
  .view-body iframe.pdf { width: min(1000px, 100%); height: 100%; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); }
  .view-body img, .view-body video { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); background: #000; }
  .view-body .note { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,.75); background: rgba(0,0,0,.35); padding: 5px 12px; border-radius: 12px; white-space: nowrap; }
  .view-top a.open { flex: none; color: #fff; text-decoration: none; font-size: 12.5px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); }
  .view-top a.open:hover { background: rgba(255,255,255,.22); }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; padding: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2); }
  .nav:hover { background: rgba(255,255,255,.24); }
  .nav:disabled { opacity: .25; }
  .nav.prev { left: 14px; } .nav.next { right: 14px; }
  @media (max-width: 640px) {
    .gal-back { padding: 10px; }
    .gal-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 7px; padding: 12px; }
    .view-body { padding: 0 12px 70px; }
    .nav { top: auto; bottom: 14px; transform: none; }
  }
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="window">
  <header>
    <div class="me">
      <button class="dp" id="dpBtn" title="Change your picture" aria-label="Change your picture">
        <div class="ring">
          <img id="dpImg" alt="" hidden>
          <div class="ph" id="dpPh"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="9" r="4"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></svg></div>
        </div>
        <span class="edit"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></span>
      </button>
      <input type="file" id="dpInput" accept="image/*" hidden>
      <div style="min-width:0">
        <div class="kicker">Photo Sorter ♡</div>
        <h1 id="title">Sorting my <em>Demo</em> folder</h1>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="v" id="stTotal">0</span><span class="l">Total files</span></div>
      <div class="stat"><span class="v" id="stPhotos">0</span><span class="l">Photos</span></div>
      <div class="stat"><span class="v" id="stVideos">0</span><span class="l">Videos</span></div>
      <div class="stat"><span class="v" id="stDups">0</span><span class="l">Duplicates</span></div>
    </div>
  </header>

  <main>

const THUMB = 144;
function squareThumb(src, w, h) {

/* Map the colour-based guess onto the albums. Albums such as People, Outfits, Food, Pets,

   until then those photos go to Everything Else. */
/* Sharpness: variance of the Laplacian on a small grey copy. Low = blurry. */
/* 64-bit difference hash for spotting near-identical photos. */
/* Read the lens name from a JPEG's EXIF (iPhones write e.g. "iPhone 14 front camera"). */

async function sha256(data) {
  const buf = typeof data === 'string' ? new TextEncoder().encode(data) : data;
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h), b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- thumbnails for videos & documents ---------- */
function fmtDur(s) { s = Math.round(s); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; }
function roundRect(x, X, Y, W, H, R) { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }
function videoThumb(frame, dur) {
  const c = document.createElement('canvas'); c.width = c.height = THUMB; const x = c.getContext('2d');
  if (frame) x.drawImage(frame, 0, 0, THUMB, THUMB);
  else { const g = x.createLinearGradient(0, 0, THUMB, THUMB); g.addColorStop(0, '#4a3b55'); g.addColorStop(1, '#2a2130'); x.fillStyle = g; x.fillRect(0, 0, THUMB, THUMB); }
  const label = dur != null ? fmtDur(dur) : 'video';
  x.font = '600 17px Inter, system-ui, sans-serif';
  const tw = x.measureText(label).width;
  x.fillStyle = 'rgba(20,10,25,.5)'; roundRect(x, THUMB - tw - 22, THUMB - 32, tw + 14, 24, 8); x.fill();
  x.fillStyle = '#fff'; x.fillText(label, THUMB - tw - 15, THUMB - 14);
  return c.toDataURL('image/jpeg', 0.85);
}
function docThumb(ext, note) {
  const c = document.createElement('canvas'); c.width = c.height = THUMB; const x = c.getContext('2d');
  x.fillStyle = '#f4eef3'; x.fillRect(0, 0, THUMB, THUMB);
  x.fillStyle = '#fff'; x.shadowColor = 'rgba(80,40,90,.18)'; x.shadowBlur = 10; x.shadowOffsetY = 3; roundRect(x, 34, 18, 76, 104, 6); x.fill(); x.shadowColor = 'transparent';
  x.fillStyle = '#ece4ee'; for (let i = 0; i < 7; i++) x.fillRect(46, 34 + i * 9, i === 6 ? 30 : 52, 3);
  const label = (ext || 'file').toUpperCase().slice(0, 7);
  x.font = '600 12px Inter, system-ui, sans-serif'; x.textAlign = 'center';
  const tint = docType(ext) && DOC_TYPE[docType(ext)].tint;
  if (tint) { const bw = Math.max(52, x.measureText(label).width + 16); x.fillStyle = tint; roundRect(x, 72 - bw / 2, 98, bw, 20, 5); x.fill(); x.fillStyle = '#fff'; x.fillText(label, 72, 112); }

/* ------------------------------------------------------------------ *
 *  Reading a real folder

// Documents share one album; inside it (and on disk) they are grouped by type.
const DOC_TYPES = [
  { id: 'pdf',    name: 'PDFs',           one: 'PDF',           tint: '#e0566b', exts: ['pdf'] },
  { id: 'sheet',  name: 'Spreadsheets',   one: 'Spreadsheet',   tint: '#3fa66b', exts: ['xls', 'xlsx', 'xlsm', 'xlsb', 'xlt', 'xltx', 'csv', 'ods', 'numbers'] },
  { id: 'slides', name: 'Presentations',  one: 'Presentation',  tint: '#e8894a', exts: ['ppt', 'pptx', 'pptm', 'pps', 'ppsx', 'pot', 'potx', 'odp', 'key'] },
  { id: 'word',   name: 'Word Documents', one: 'Word document', tint: '#4f7fd9', exts: ['doc', 'docx', 'docm', 'dot', 'dotx', 'odt', 'rtf', 'pages'] },
];
const DOC_TYPE = Object.fromEntries(DOC_TYPES.map(t => [t.id, t]));
const DOC_BY_EXT = Object.fromEntries(DOC_TYPES.flatMap(t => t.exts.map(e => [e, t.id])));
const docType = ext => DOC_BY_EXT[ext] || null;
// Where an item goes on disk
const folderOf = it => it.cat === 'docs' && it.docType ? ['Documents', DOC_TYPE[it.docType].name] : CAT[it.cat].folder;



function markDuplicates(items) {
  // The plainest name stays in its album; identical "copy" / "(1)" files go to Double takes.
  const copyish = n => /( copy( \d+)?| \(\d+\)|[-_ ]kopie|[-_ ]copia)$/i.test(n.replace(/\.[^.]+$/, '')) ? 1 : 0;
  const sorted = [...items].sort((a, b) => copyish(a.name) - copyish(b.name) || a.name.length - b.name.length || a.name.localeCompare(b.name, undefined, { numeric: true }));
  const seen = new Map();
  for (const it of sorted) {
    if (!it.hash) continue;
    if (seen.has(it.hash)) { it.dupOf = seen.get(it.hash).name; it.origCat = it.cat; it.cat = 'dups'; }
    else seen.set(it.hash, it);
  }
}




function finishLoad(items) {
  S.items = items;
  statTarget.total = items.length;
  resetCounters();
  const used = new Set(items.map(i => i.cat));
  for (const c of CATS) counters[c.id].el.hidden = !used.has(c.id);
  buildCards(items);
  if (!items.length) {

/* ------------------------------------------------------------------ *
 *  Demo photos — painted to look like soft, real photographs
 * ------------------------------------------------------------------ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
const P = 144;
let R = Math.random;
const pick = a => a[Math.floor(R() * a.length)];
const rr = (a, b) => a + R() * (b - a);
function lin(x, stops, x0 = 0, y0 = 0, x1 = 0, y1 = P) { const g = x.createLinearGradient(x0, y0, x1, y1); stops.forEach(([p, c]) => g.addColorStop(p, c)); return g; }
function glow(x, cx, cy, r, col, a = 1) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); x.globalAlpha = a; x.fillStyle = g; x.fillRect(0, 0, P, P); x.globalAlpha = 1; }
function ell(x, cx, cy, rx, ry, col, rot = 0) { x.fillStyle = col; x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); x.fill(); }
function blur(x, px, fn) { x.filter = `blur(${px}px)`; fn(); x.filter = 'none'; }
function finishPhoto(c, x, { grain = 9, vignette = .32, tint = null, gray = false } = {}) {
  if (tint) { x.globalCompositeOperation = 'soft-light'; x.fillStyle = tint; x.fillRect(0, 0, P, P); x.globalCompositeOperation = 'source-over'; }
  const v = x.createRadialGradient(P / 2, P / 2, P * 0.32, P / 2, P / 2, P * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(25,10,30,${vignette})`); x.fillStyle = v; x.fillRect(0, 0, P, P);
  const img = x.getImageData(0, 0, P, P), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (R() - 0.5) * grain;
    if (gray) { const L = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2] - 128) * 1.15 + 128 + n; d[i] = d[i + 1] = d[i + 2] = L; }
    else { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  }
  x.putImageData(img, 0, 0);
  return c;
}

const paint = {
  golden() {
    const [c, x] = canvasOf(P, P);
    const hz = rr(.58, .72) * P, sx = rr(.25, .75) * P;
    x.fillStyle = lin(x, [[0, pick(['#e7a37c', '#d98e7a', '#f0b27a'])], [.55, pick(['#f6c48a', '#f3b98b'])], [1, '#f9dca5']], 0, 0, 0, hz); x.fillRect(0, 0, P, hz);
    glow(x, sx, hz - 6, 70, 'rgba(255,236,190,1)', .95);
    blur(x, 1.2, () => ell(x, sx, hz - 8, 11, 11, '#fff3d6'));
    const kind = R();
    if (kind < .5) {                                   // sea at sunset
      x.fillStyle = lin(x, [[0, '#b77e70'], [1, '#4a2f38']], 0, hz, 0, P); x.fillRect(0, hz, P, P - hz);
      blur(x, 2, () => { x.globalAlpha = .7; x.fillStyle = '#ffe2b0'; for (let i = 0; i < 10; i++) x.fillRect(sx - rr(4, 16), hz + i * 5 + 3, rr(8, 32), 1.6); x.globalAlpha = 1; });
    } else {                                           // hills / field silhouette
      blur(x, 1.5, () => { x.fillStyle = '#5b3a3d'; x.beginPath(); x.moveTo(0, P); for (let i = 0; i <= 6; i++) x.lineTo(i * P / 6, hz + Math.sin(i * 1.7 + R() * 2) * 7); x.lineTo(P, P); x.fill(); });
      x.fillStyle = lin(x, [[0, 'rgba(60,35,40,.0)'], [1, '#2e1d24']], 0, hz, 0, P); x.fillRect(0, hz, P, P - hz);
      if (R() < .6) blur(x, 1, () => { const px = rr(.2, .8) * P; x.fillStyle = '#2b1a20'; ell(x, px, hz - 22, 6, 7, '#2b1a20'); x.fillRect(px - 7, hz - 15, 14, 30); });

  },
  night() {

  list.forEach((it, i) => {
    if (catId === 'docs' && it.docType !== lastType) {
      lastType = it.docType;
      const t = DOC_TYPE[it.docType], n = list.filter(x => x.docType === it.docType).length;
      const h = document.createElement('div'); h.className = 'gal-sec';
      h.innerHTML = `<i style="background:${t ? t.tint : 'var(--faint)'}"></i>${esc(t ? t.name : 'Other')}<span>${n}</span>`;
      frag.appendChild(h);
    }
    const b = document.createElement('button'); b.className = 'tile'; b.title = it.name;
    b.setAttribute('aria-label', `${it.kind === 'video' ? 'Video' : it.kind === 'photo' ? 'Photo' : it.kind === 'doc' ? 'Document' : 'File'} ${it.name}`);
    const im = document.createElement('img'); im.src = it.thumb; im.alt = ''; im.loading = 'lazy'; im.decoding = 'async';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = it.name;
    b.append(im, nm); b.onclick = () => openViewer(i);
    frag.appendChild(b);
  });
  grid.appendChild(frag);
  $('galBack').classList.add('on');
  setTimeout(() => $('galClose').focus(), 0);
}
function closeAlbum() {
  closeViewer();
  G.open = false; G.list = []; $('galBack').classList.remove('on'); $('galGrid').innerHTML = '';
  const k = G.cat && counters[G.cat]; if (k) k.el.focus();
}
function freeUrl() { if (G.url) { URL.revokeObjectURL(G.url); G.url = null; } }
async function openViewer(i) {
  if (i < 0 || i >= G.list.length) return;
  G.idx = i; freeUrl(); document.querySelectorAll('.view-top a.open').forEach(a => a.remove());
  const it = G.list[i], body = $('viewBody');
  $('viewName').innerHTML = `${esc(it.name)}<span>${i + 1} of ${G.list.length}${it.kind === 'video' && it.dur ? ' · ' + fmtDur(it.dur) : ''}</span>`;
  const navs = `<button class="nav prev" aria-label="Previous" ${i ? '' : 'disabled'}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" aria-label="Next" ${i < G.list.length - 1 ? '' : 'disabled'}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>`;
  body.innerHTML = `<img src="${it.thumb}" alt="">` + navs;
  body.querySelector('.prev').onclick = () => openViewer(G.idx - 1);
  body.querySelector('.next').onclick = () => openViewer(G.idx + 1);
  $('view').classList.add('on');
  const note = txt => { const n = document.createElement('div'); n.className = 'note'; n.textContent = txt; body.appendChild(n); };
  if (!it.handle) { note(S.mode === 'demo' ? (it.kind === 'doc' ? 'Demo file. In the full version, your PDFs open right here.' : 'Demo preview. The full version opens your own photos full size.') : 'Preview only'); return; }
  if (it.ext === 'pdf') {
    try {
      const f = await it.handle.getFile();
      if (G.idx !== i || !$('view').classList.contains('on')) return;
      G.url = URL.createObjectURL(new Blob([f], { type: 'application/pdf' }));
      const fr = document.createElement('iframe'); fr.className = 'pdf'; fr.title = it.name; fr.src = G.url;
      body.querySelector('img').replaceWith(fr);
      const a = document.createElement('a'); a.className = 'open'; a.href = G.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open in new tab ↗';
      $('viewClose').before(a);
    } catch (e) { console.warn('Could not open', it.name, e); note('Couldn’t open this PDF.'); }
    return;
  }
  if (it.kind === 'doc') { note(`${(DOC_TYPE[it.docType] || { one: 'These' }).one} files can’t be previewed in the browser. Open it from the ${folderOf(it).join(' / ')} folder.`); return; }
  if (it.kind !== 'photo' && it.kind !== 'video') { note(it.unreadable ? 'This file can’t be previewed in the browser' : 'Not a photo or video'); return; }
  try {
    const f = await it.handle.getFile();
    if (G.idx !== i || !$('view').classList.contains('on')) return;   // user moved on meanwhile
    G.url = URL.createObjectURL(f);
    let el;
    if (it.kind === 'video') { el = document.createElement('video'); el.controls = true; el.autoplay = true; el.playsInline = true; }
    else { el = document.createElement('img'); el.alt = it.name; }
    el.src = G.url;
    body.querySelector('img').replaceWith(el);
  } catch (e) {
    console.warn('Could not open', it.name, e);
    note('Couldn’t open the full file. It may have been moved or renamed outside Photo Sorter.');
  }
}
function closeViewer() {
  $('view').classList.remove('on'); freeUrl(); document.querySelectorAll('.view-top a.open').forEach(a => a.remove()); $('viewBody').innerHTML = '';
  if (G.idx >= 0 && G.open) { const t = $('galGrid').querySelectorAll('.tile')[G.idx]; if (t) t.focus(); }
  G.idx = -1;
}
for (const c of CATS) {
  const el = counters[c.id].el;
  el.tabIndex = 0; el.setAttribute('role', 'button');
  el.title = `${c.sub}. Click to look inside after sorting.`;
  el.addEventListener('click', () => openAlbum(c.id));
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openAlbum(c.id); } });
}
$('galClose').onclick = closeAlbum;
$('viewClose').onclick = closeViewer;
$('galBack').addEventListener('click', e => { if (e.target === $('galBack')) closeAlbum(); });
$('viewBody').addEventListener('click', e => { if (e.target === $('viewBody')) closeViewer(); });

/* ------------------------------------------------------------------ *
 *  Demo: Choose folder is part of the full version
 * ------------------------------------------------------------------ */
function showDemoNotice() {
  if (S.busy) return;
  openModal(`<h2>This is a <em>demo</em></h2>
    <p>Choosing a folder only works in the full version. This demo sorts built-in sample photos, so you can see how it works.</p>
    <p>The full version sorts the real folders on your computer: photos, videos, screenshots, duplicates, PDFs, spreadsheets, presentations and Word documents. Choose <b>Copy</b> or <b>Move</b>, and <b>Undo</b> anytime. Your photos are never uploaded.</p>
    <p class="fine">Works in Chrome or Edge on a computer.</p>
    <div class="actions"><button class="ghost" id="mLater">Keep trying the demo</button><a class="primary" href="${esc(SHOP_URL)}" target="_blank" rel="noopener">Get the full version</a></div>`);
  $('mLater').onclick = closeModal;
}

/* ------------------------------------------------------------------ *
 *  Wiring
 * ------------------------------------------------------------------ */
$('btnChoose').onclick = showDemoNotice;
$('btnDemo').onclick = loadDemo;
$('btnReplay').onclick = replay;
$('btnSort').onclick = startSort;
document.querySelector('.dock').addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('[contenteditable], input, textarea')) return;
  if (modalOpen) { if (e.key === 'Escape' && modalDismiss) modalDismiss(); return; }
  if ($('view').classList.contains('on')) {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') openViewer(G.idx - 1);
    else if (e.key === 'ArrowRight') openViewer(G.idx + 1);
    return;
  }
  if (G.open) { if (e.key === 'Escape') closeAlbum(); return; }
  if (e.code === 'Space') { e.preventDefault(); startSort(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); replay(); }
});

loadDemo();
</script>
</body>
